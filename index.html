<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>在庫管理 - 店舗スタッフ</title>


    <link rel="stylesheet" href="css/common.css?v=e55900bd9636">
    <link rel="stylesheet" href="css/user.css?v=e30914a80703">
<link rel="stylesheet" href="css/integration.css?v=b7d9206e0e2d"><link rel="stylesheet" href="css/shared-ui.css?v=d4cf2c0dfe0c"><link rel="stylesheet" href="css/shared-header.css?v=6de7f07f8bd2"></head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen hidden">
        <div class="login-wrapper">
            <section class="login-card" aria-labelledby="login-title">
                <div class="login-header">
                    <div class="login-logo"><img src="css/images/header_logo_02.png?v=34b50f4c1c85" alt="じゃんぼ總本店" width="410" height="69"></div>
                    <h1 id="login-title">在庫管理</h1>
                    <p>店舗スタッフ用ログイン</p>
                </div>

                <form id="login-form" autocomplete="on" novalidate>
                    <div class="form-group">
                        <label for="store-id">店舗ID</label>
                        <input
                            type="text"
                            id="store-id"
                            name="username"
                            class="form-input"
                            required
                            autocomplete="username"
                            autocapitalize="none"
                            spellcheck="false"
                            placeholder="store_01"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">パスワード</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            required
                            autocomplete="current-password"
                            placeholder="••••••••"
                        >
                    </div>

                    <label class="remember-login">
                        <input type="checkbox" id="remember-store-id">
                        <span>この端末に店舗IDを保存する</span>
                    </label>

                    <p class="password-save-note">
                        パスワードの保存はブラウザの確認画面から行います。
                    </p>

                    <div id="login-error" class="error-msg hidden" role="alert" aria-live="polite"></div>

                    <button type="submit" class="btn btn-full btn-primary" id="login-btn">
                        <span>ログイン</span>
                        <span class="spinner hidden" aria-hidden="true"></span>
                    </button>
                </form>
            </section>
        </div>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="screen hidden">
        <header class="app-header shared-header">
            <div class="header-left">
                <div class="header-title-group">
                    <span class="header-label">在庫管理</span>
                    <h1 id="header-store-name">店舗名</h1>
                </div>
            </div>

            <button
                id="logout-btn"
                class="btn-icon btn-ghost"
                type="button"
                title="ログアウト"
                aria-label="ログアウト"
            >
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </header>

        <main class="app-main"><nav class="integration-nav" aria-label="在庫管理の切り替え"><span aria-current="page"><strong>毎日在庫</strong></span><a href="monthly.html">月末棚卸に切り替え</a></nav>
            <p class="inventory-guide">
                倉庫数と使用数を入力すると、残数が自動で更新されます。
            </p>

            <nav class="tabs-container" aria-label="部門選択">
                <div id="department-tabs" class="tabs">
                    <!-- Tabs dynamically injected -->
                </div>
            </nav>

            <section class="inventory-container" aria-label="在庫一覧">
                <div class="inventory-header-row" aria-hidden="true">
                    <div class="col-name">商品名</div>
                    <div class="col-warehouse">倉庫</div>
                    <div class="col-used">使用数</div>
                    <div class="col-remaining">残数</div>
                </div>

                <div id="inventory-list" class="inventory-list" aria-live="polite">
                    <!-- Items dynamically injected -->
                </div>

                <div id="empty-state" class="empty-state hidden" role="status">
                    <h2>表示できる商品がありません</h2>
                    <p>別の部門を選択するか、管理者に確認してください。</p>
                </div>
            </section>
        </main>

        <div class="actions-container">
            <button id="copy-btn" class="btn btn-secondary" type="button">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>残数をコピー</span>
            </button>
        </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Firebase SDKs -->

    <!-- App Scripts -->
    <script src="js/vendor/firebase-app-compat.js?v=d7e73ad20385"></script>
<script src="js/vendor/firebase-auth-compat.js?v=08820a53b534"></script>
<script src="js/vendor/firebase-database-compat.js?v=899e5799c5a3"></script>
<script src="js/vendor/firebase-app-check-compat.js?v=9565bcf916fa"></script>
<script src="js/runtime-config.js?v=b4bc49ef4593"></script>
<script src="js/firebase-config.js?v=997a74894992"></script>
    <script src="js/auth.js?v=3bc0ec0f6f5b"></script>
    <script src="js/db.js?v=483c4818fec0"></script>
    <script src="js/user-app.js?v=076416a63862"></script>
</body>
</html>
