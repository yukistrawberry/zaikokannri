<!DOCTYPE html>
<html lang="ja">
<head>

  <title>次在庫表（Firebase）</title>

  <style>

      box-sizing: border-box;
    }

    body {

    }

    h1 {
      margin: 0 0 14px;
      font-size: 22px;
    }

    .top-fields,

      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    input,
    select,
    button {
      font: inherit;
    }

    .top-fields input,
    select,
    button {
      min-height: 42px;
      border: 1px solid #999;
      border-radius: 4px;
      background: #fff;
      padding: 8px 10px;
    }

    .top-fields input {
      width: 170px;
      margin-left: 4px;
    }

    select {
      min-width: 220px;
    }

    button {
      cursor: pointer;
      background: #f5f5f5;
    }

    button:hover {
      background: #e8e8e8;
    }

    button:disabled {
      color: #aaa;
      cursor: default;
    }

    .sync-status {
      margin-left: auto;
      color: #666;
      font-size: 13px;
      font-weight: bold;
    }

    .sync-status.online {
      color: #18794e;
    }

    .sync-status.saving {
      color: #9a6700;
    }

    .sync-status.error {
      color: #b42318;
    }

    .sheet-title {
      margin: 18px 0 8px;
      font-size: 20px;
    }

    .table-container {
      overflow-x: auto;
      border: 1px solid #aaa;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 760px;
    }

    th,
    td {
      border: 1px solid #aaa;
      padding: 7px;
      text-align: center;
    }

    th {
      background: #f2f2f2;
      white-space: nowrap;
    }

    td.category {
      width: 110px;
      font-weight: bold;
      background: #fafafa;
    }

    td.name {
      min-width: 230px;
      text-align: left;
    }

    td.unit {
      width: 60px;
    }

    td input[type="number"] {
      width: 72px;
      padding: 7px 4px;
      border: 1px solid #999;
      border-radius: 3px;
      text-align: center;
      font-size: 16px;
    }

    td.total {
      min-width: 75px;
      font-weight: bold;
      background: #fafafa;
    }

    tr.group-start td {
      border-top-width: 3px;
    }

    .bottom-buttons {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
    }

    .bottom-buttons button {
      flex: 1;
      max-width: 180px;
    }

    .note {
      margin-top: 10px;
      color: #666;
      font-size: 13px;
    }

    .error-box {
      display: none;
      margin: 10px 0;
      border: 1px solid #e0a29a;
      border-radius: 4px;
      padding: 10px;
      background: #fff4f2;
      color: #8f2018;
      white-space: pre-wrap;
    }

    @media (max-width: 600px) {
      body {
        margin: 8px;
        font-size: 15px;
      }

      h1 {
        font-size: 20px;
      }

      .top-fields {
        display: grid;
        grid-template-columns: 1fr;
      }

      .top-fields label {
        display: grid;
        grid-template-columns: 65px 1fr;
        align-items: center;
      }

      .top-fields input {
        width: 100%;
        margin-left: 0;
      }

      .sheet-controls {
        display: grid;
        grid-template-columns: 1fr auto;
      }

      select {
        min-width: 0;
        width: 100%;
      }

      .sync-status {
        grid-column: 1 / -1;
        margin-left: 0;
      }

      th,
      td {
        padding: 6px;
        font-size: 14px;
      }

      td input[type="number"] {
        width: 62px;
        font-size: 16px;
      }
    }
  </style>
</head>

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const STORE_MEMORY_KEY = "nextInventoryLastStore";
    const MONTH_MEMORY_KEY = "nextInventoryLastMonth";

    const sheetSelect = document.getElementById("sheetSelect");
    const inventoryBody = document.getElementById("inventoryBody");
    const sheetTitle = document.getElementById("sheetTitle");
    const storeNameInput = document.getElementById("storeName");
    const targetMonthInput = document.getElementById("targetMonth");
    const syncStatus = document.getElementById("syncStatus");
    const errorBox = document.getElementById("errorBox");
    const resetButton = document.getElementById("resetButton");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");

    let activeSheet = 0;
    let values = {};
    let currentDataRef = null;
    let stopCurrentListener = null;
    let contextTimer = null;
    const writeTimers = new Map();

    function setStatus(text, type = "") {
      syncStatus.textContent = text;
      syncStatus.className = `sync-status ${type}`.trim();
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
      setStatus("同期エラー", "error");
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    function getDefaultMonth() {
      const today = new Date();
      return (
        `${today.getFullYear()}-` +
        `${String(today.getMonth() + 1).padStart(2, "0")}`
      );
    }

    function storeNameToKey(storeName) {
      const bytes = new TextEncoder().encode(storeName.trim());
      let binary = "";

      bytes.forEach(byte => {
        binary += String.fromCharCode(byte);
      });

      return btoa(binary)
        .replaceAll("+", "-")
        .replaceAll("/", "_")
        .replace(/=+$/g, "");
    }

    function getCurrentPath() {
      const storeName = storeNameInput.value.trim();
      const month = targetMonthInput.value;

      if (!storeName || !month) {
        return null;
      }

      return (
        `nextInventory/${storeNameToKey(storeName)}/${month}`
      );
    }

    function normalizeStoredValues(rawValues) {
      const normalized = {};

      if (!rawValues || typeof rawValues !== "object") {
        return normalized;
      }

      Object.entries(rawValues).forEach(([itemId, itemValues]) => {
        if (!itemValues || typeof itemValues !== "object") {
          return;
        }

        normalized[itemId] = [
          itemValues.v1 ?? "",
          itemValues.v2 ?? "",
          itemValues.v3 ?? ""
        ];
      });

      return normalized;
    }

    function getValues(itemId) {
      return values[itemId] || ["", "", ""];
    }

    function calculateTotal(rowValues) {
      return rowValues.reduce((sum, value) => {
        if (value === "") {
          return sum;
        }

        const number = Number(value);
        return Number.isFinite(number) ? sum + number : sum;
      }, 0);
    }

    function formatNumber(value) {
      return Number.isInteger(value)
        ? String(value)
        : String(Math.round(value * 1000) / 1000);
    }

    function renderSheetOptions() {
      DATA.pages.forEach((page, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = `${index + 1}ページ目　${page.name}`;
        sheetSelect.appendChild(option);
      });
    }

    function renderSheet() {
      const page = DATA.pages[activeSheet];

      sheetSelect.value = String(activeSheet);
      sheetTitle.textContent =
        `${activeSheet + 1}ページ目　${page.name}`;
      inventoryBody.innerHTML = "";

      let previousCategory = "";

      page.items.forEach(item => {
        const tr = document.createElement("tr");
        tr.dataset.itemId = item.id;

        if (item.category !== previousCategory) {
          tr.classList.add("group-start");
        }

        const categoryTd = document.createElement("td");
        categoryTd.className = "category";
        categoryTd.textContent =
          item.category !== previousCategory ? item.category : "";

        const nameTd = document.createElement("td");
        nameTd.className = "name";
        nameTd.textContent = item.name;

        const unitTd = document.createElement("td");
        unitTd.className = "unit";
        unitTd.textContent = item.unit;

        tr.appendChild(categoryTd);
        tr.appendChild(nameTd);
        tr.appendChild(unitTd);

        const rowValues = getValues(item.id);

        for (let index = 0; index < 3; index += 1) {
          const td = document.createElement("td");
          const input = document.createElement("input");

          input.type = "number";
          input.min = "0";
          input.step = "any";
          input.inputMode = "decimal";
          input.value = rowValues[index] ?? "";
          input.dataset.itemId = item.id;
          input.dataset.valueIndex = String(index);
          input.setAttribute(
            "aria-label",
            `${item.name} 在庫数${index + 1}`
          );

          input.addEventListener("input", () => {
            handleValueInput(item.id, tr);
          });

          input.addEventListener("keydown", event => {
            if (event.key !== "Enter") {
              return;
            }

            event.preventDefault();

            const allInputs = Array.from(
              inventoryBody.querySelectorAll('input[type="number"]')
            );
            const currentIndex = allInputs.indexOf(input);
            const nextInput = allInputs[currentIndex + 1];

            if (nextInput) {
              nextInput.focus();
              nextInput.select();
            }
          });

          td.appendChild(input);
          tr.appendChild(td);
        }

        const totalTd = document.createElement("td");
        totalTd.className = "total";
        totalTd.textContent =
          formatNumber(calculateTotal(rowValues));
        tr.appendChild(totalTd);

        inventoryBody.appendChild(tr);
        previousCategory = item.category;
      });

      prevButton.disabled = activeSheet === 0;
      nextButton.disabled =
        activeSheet === DATA.pages.length - 1;
    }

    function refreshVisibleValues() {
      inventoryBody.querySelectorAll("tr[data-item-id]").forEach(tr => {
        const itemId = tr.dataset.itemId;
        const rowValues = getValues(itemId);
        const inputs = tr.querySelectorAll('input[type="number"]');

        inputs.forEach((input, index) => {
          if (document.activeElement !== input) {
            input.value = rowValues[index] ?? "";
          }
        });

        tr.querySelector(".total").textContent =
          formatNumber(calculateTotal(rowValues));
      });
    }

    function handleValueInput(itemId, row) {
      if (!currentDataRef) {
        showError("店舗名と対象月を入力してください。");
        return;
      }

      const rowInputs = Array.from(
        row.querySelectorAll('input[type="number"]')
      );
      const rowValues = rowInputs.map(input => input.value);

      values[itemId] = rowValues;
      row.querySelector(".total").textContent =
        formatNumber(calculateTotal(rowValues));

      setStatus("保存中…", "saving");
      clearTimeout(writeTimers.get(itemId));

      const pathAtEdit = getCurrentPath();
      const dataRefAtEdit = currentDataRef;

      const timer = setTimeout(async () => {
        try {
          if (!pathAtEdit || !dataRefAtEdit) {
            throw new Error("保存先が選択されていません。");
          }

          const itemRef = ref(
            database,
            `${pathAtEdit}/values/${itemId}`
          );

          if (rowValues.every(value => value === "")) {
            await set(itemRef, null);
          } else {
            await set(itemRef, {
              v1: rowValues[0] ?? "",
              v2: rowValues[1] ?? "",
              v3: rowValues[2] ?? ""
            });
          }

          await update(dataRefAtEdit, {
            "meta/storeName": storeNameInput.value.trim(),
            "meta/updatedAt": serverTimestamp()
          });

          setStatus("Firebase同期済み", "online");
        } catch (error) {
          showError(
            "Firebaseへの保存に失敗しました。\n" +
            error.message
          );
        }
      }, 350);

      writeTimers.set(itemId, timer);
    }

    function connectCurrentData() {
      clearTimeout(contextTimer);

      contextTimer = setTimeout(() => {
        const currentPath = getCurrentPath();

        localStorage.setItem(
          STORE_MEMORY_KEY,
          storeNameInput.value.trim()
        );
        localStorage.setItem(
          MONTH_MEMORY_KEY,
          targetMonthInput.value
        );

        if (stopCurrentListener) {
          stopCurrentListener();
          stopCurrentListener = null;
        }

        values = {};
        refreshVisibleValues();
        clearError();

        if (!currentPath) {
          currentDataRef = null;
          setStatus("店舗名と対象月を入力", "error");
          return;
        }

        setStatus("Firebase接続中…");
        currentDataRef = ref(database, currentPath);

        stopCurrentListener = onValue(
          currentDataRef,
          snapshot => {
            const data = snapshot.val() || {};
            values = normalizeStoredValues(data.values);
            refreshVisibleValues();
            setStatus("Firebase同期済み", "online");
            clearError();
          },
          error => {
            showError(
              "Firebaseからデータを読み込めません。\n" +
              "Realtime Databaseのルールを確認してください。\n\n" +
              error.message
            );
          }
        );
      }, 400);
    }

    async function resetCurrentSheet() {
      if (!currentDataRef) {
        alert("店舗名と対象月を入力してください。");
        return;
      }

      const page = DATA.pages[activeSheet];

      if (!confirm(
        `「${page.name}」の入力をすべて消去しますか？`
      )) {
        return;
      }

      const updates = {};

      page.items.forEach(item => {
        updates[`values/${item.id}`] = null;
        delete values[item.id];
      });

      updates["meta/storeName"] =
        storeNameInput.value.trim();
      updates["meta/updatedAt"] =
        serverTimestamp();

      try {
        setStatus("消去中…", "saving");
        await update(currentDataRef, updates);
        refreshVisibleValues();
        setStatus("Firebase同期済み", "online");
      } catch (error) {
        showError(
          "シートの消去に失敗しました。\n" +
          error.message
        );
      }
    }

    function changeSheet(index) {
      if (
        index < 0 ||
        index >= DATA.pages.length
      ) {
        return;
      }

      activeSheet = index;
      renderSheet();
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    storeNameInput.value =
      localStorage.getItem(STORE_MEMORY_KEY) ||
      "堺東店";

    targetMonthInput.value =
      localStorage.getItem(MONTH_MEMORY_KEY) ||
      getDefaultMonth();

    renderSheetOptions();
    renderSheet();
    connectCurrentData();

    storeNameInput.addEventListener(
      "input",
      connectCurrentData
    );

    targetMonthInput.addEventListener(
      "change",
      connectCurrentData
    );

    sheetSelect.addEventListener("change", () => {
      changeSheet(Number(sheetSelect.value));
    });

    resetButton.addEventListener(
      "click",
      resetCurrentSheet
    );

    prevButton.addEventListener("click", () => {
      changeSheet(activeSheet - 1);
    });

    nextButton.addEventListener("click", () => {
      changeSheet(activeSheet + 1);
    });
  </script>
</body>
</html>
