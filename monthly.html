<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>月末棚卸</title>
  <link rel="stylesheet" href="css/monthly.css?v=69144269d4f8">
  <link rel="stylesheet" href="css/integration.css?v=b7d9206e0e2d">
<link rel="stylesheet" href="css/shared-ui.css?v=d4cf2c0dfe0c"><link rel="stylesheet" href="css/shared-header.css?v=6de7f07f8bd2"></head>
<body>
  <header class="app-header shared-header">
            <div class="header-left">
                <div class="header-title-group">
                    <span class="header-label">在庫管理</span>
                    <h1 id="header-store-name">店舗名</h1>
                </div>
            </div>

            <button
                id="logout-btn"
                class="btn-icon btn-ghost"
                type="button"
                title="ログアウト"
                aria-label="ログアウト"
            >
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </header>

  

  <main class="monthly-main"><nav class="integration-nav" aria-label="在庫管理の切り替え"><a href="index.html">毎日在庫に切り替え</a><span aria-current="page"><strong>月末棚卸</strong></span></nav><section class="monthly-tools"><div class="header-row"><h1>月末棚卸</h1><div id="saveStatus" class="save-status">自動保存</div></div><div class="toolbar">
      <input id="searchInput" class="search" type="search" placeholder="品目名を検索" autocomplete="off" aria-label="品目名を検索">
      <button id="openReset" class="action-button" type="button">リセット</button>
    </div></section><nav class="tabs-wrap" aria-label="在庫カテゴリ">
    <div id="tabs" class="tabs" role="tablist"></div>
  </nav>
    <div class="category-info">
      <h2 id="categoryTitle" class="category-title"></h2>
      <span id="itemCount" class="item-count"></span>
    </div>
    <p id="gestureHint" class="gesture-hint">左スワイプで削除／右上の「⠿」を長押しして並べ替え</p>
    <section id="items" class="items" aria-live="polite"></section>
  </main>

  <div id="resetSheet" class="sheet-backdrop" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
    <div class="sheet">
      <h2 id="resetTitle">入力内容をリセット</h2>
      <p>倉庫①・②・③に入力したすべての数量を0に戻します。追加した品目と並び順は残ります。</p>
      <div class="sheet-actions">
        <button id="cancelReset" class="sheet-button cancel-button" type="button">キャンセル</button>
        <button id="confirmReset" class="sheet-button reset-button" type="button">すべて0にする</button>
      </div>
    </div>
  </div>

  <div id="addSheet" class="sheet-backdrop" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <form id="addForm" class="sheet" novalidate>
      <h2 id="addTitle">品目を追加</h2>
      <p id="addCategoryText"></p>
      <div class="form-group">
        <label class="form-label" for="newItemName">品目名</label>
        <input id="newItemName" class="form-input" type="text" maxlength="80" autocomplete="off" placeholder="例：キャベツ" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="newItemUnit">単位</label>
        <input id="newItemUnit" class="form-input" type="text" maxlength="12" list="unitOptions" autocomplete="off" placeholder="例：Kg" required>
        <datalist id="unitOptions">
          <option value="Kg"><option value="本"><option value="袋"><option value="缶"><option value="枚">
          <option value="CS"><option value="Pc"><option value="個"><option value="箱"><option value="パック">
        </datalist>
      </div>
      <div id="addError" class="form-error" aria-live="polite"></div>
      <div class="sheet-actions">
        <button id="cancelAdd" class="sheet-button cancel-button" type="button">キャンセル</button>
        <button class="sheet-button primary-button" type="submit">追加する</button>
      </div>
    </form>
  </div>

  <div id="snackbar" class="snackbar" hidden role="status" aria-live="polite">
    <span id="snackbarMessage" class="snackbar-message"></span>
  </div>

  <script src="js/monthly-app.js?v=56622f085583"></script>
  <script src="js/vendor/firebase-app-compat.js?v=d7e73ad20385"></script>
<script src="js/vendor/firebase-auth-compat.js?v=08820a53b534"></script>
<script src="js/vendor/firebase-database-compat.js?v=899e5799c5a3"></script>
<script src="js/vendor/firebase-app-check-compat.js?v=9565bcf916fa"></script>
<script src="js/runtime-config.js?v=b4bc49ef4593"></script>
<script src="js/firebase-config.js?v=997a74894992"></script>
<script src="js/auth.js?v=3bc0ec0f6f5b"></script>
<script src="js/transfer-core.js?v=554ec2d5745e"></script>
  <script src="js/sync-mappings.js?v=82495ae5aaf2"></script>
  <script src="js/monthly-integration.js?v=04c0acb030f1"></script>
</body>
</html>
